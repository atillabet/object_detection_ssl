# Ultralytics YOLO11 detection model with a TorchVision ResNet50 backbone.
# This variant is designed for SSL backbone transfer, e.g. SwAV/MoCo checkpoints.

nc: 80

backbone:
  - [-1, 1, TorchVision, [2048, resnet50, DEFAULT, True, 2, True]]

head:
  - [0, 1, Index, [512, 6]] # P3 from ResNet layer2
  - [0, 1, Index, [1024, 7]] # P4 from ResNet layer3
  - [0, 1, Index, [2048, 8]] # P5 from ResNet layer4
  - [[1, 2, 3], 1, Detect, [nc]]
